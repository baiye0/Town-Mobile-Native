name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [codex/native-mobile]
    paths:
      - android/**
      - .gitmodules
      - .github/workflows/android-apk.yml
      - scripts/ci/package-android.sh

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Being APK with Portal
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out pinned Portal submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK and pinned NDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Install pinned Rust and Android targets
        run: rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android

      - name: Cache Rust dependencies and both Android targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/portal-runtime/build/cargo
          key: android-rust-${{ runner.os }}-1.90.0-ndk27-${{ hashFiles('android/portal-runtime/upstream/Cargo.lock', 'android/portal-runtime/upstream/**/Cargo.toml', 'android/portal-runtime/upstream/portal/src/**/*.rs', 'android/portal-runtime/build.gradle.kts') }}
          restore-keys: android-rust-${{ runner.os }}-1.90.0-ndk27-

      - name: Test, lint and build Being (ARM64 and x86_64 Portal)
        working-directory: android
        run: ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Verify and package APK
        id: package
        shell: bash
        run: bash scripts/ci/package-android.sh

      - name: Upload installable APK and checksums
        id: apk
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Being-Android-${{ steps.package.outputs.short_sha }}
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Add download link
        env:
          ARTIFACT_URL: ${{ steps.apk.outputs.artifact-url }}
        run: printf '\n[Download APK artifact](%s)\n' "$ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14
