name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and sign Release APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - name: Check out pinned Portal submodule
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21 and Gradle cache
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle.kts
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Install Android SDK and pinned NDK
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null || true
          "$sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;27.2.12479018"

      - name: Install pinned Rust and Android targets
        run: rustup toolchain install 1.90.0 --profile minimal --target aarch64-linux-android --target x86_64-linux-android

      - name: Cache Rust dependencies and both Android targets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            android/portal-runtime/build/cargo
          key: android-rust-${{ runner.os }}-1.90.0-ndk27-${{ hashFiles('android/portal-runtime/upstream/Cargo.lock', 'android/portal-runtime/upstream/**/Cargo.toml', 'android/portal-runtime/upstream/portal/src/**/*.rs', 'android/portal-runtime/build.gradle.kts') }}
          restore-keys: android-rust-${{ runner.os }}-1.90.0-ndk27-

      - name: Validate release tag and version
        run: |
          python3 scripts/ci/test-release-validation.py
          python3 scripts/ci/validate-release.py

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/being-release.jks"

      - name: Test, lint and build signed Release
        working-directory: android
        env:
          ANDROID_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/being-release.jks
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --max-workers=2 :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease

      - name: Remove restored signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/being-release.jks"

      - name: Verify signature, version, ABIs and alignment
        run: bash scripts/ci/package-android.sh release

      - name: Include release notes and upload verified assets
        run: cp "docs/releases/$GITHUB_REF_NAME.md" dist/android/RELEASE-NOTES.md

      - name: Upload verified Release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-${{ github.ref_name }}
          path: dist/android/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Android-release-reports-${{ github.run_id }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publishing script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Download verified assets from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: android-release-${{ github.ref_name }}
          path: dist/android/

      - name: Publish assets as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-android-release.sh
