<!doctype html><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval'; worker-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'"><script>
let initialized=false;
window.addEventListener('message',function initialize(e){
 if(e.source!==parent||initialized||e.data?.type!=='init'||typeof e.data.code!=='string')return;
 initialized=true;
 try {
 const url=URL.createObjectURL(new Blob([e.data.code],{type:'text/javascript'}));
 const worker=new Worker(url);URL.revokeObjectURL(url);
let booting=true, pending=true, started=performance.now(), stopped=false, burst=0, burstAt=performance.now();
const events=[];
function stop(message) { if(stopped)return;stopped=true;events.length=0;worker.terminate();parent.postMessage({type:'error',message},'*'); }
function dispatch(message) { pending=true;started=performance.now();worker.postMessage(message); }
worker.onmessage=e=>{
 if(stopped)return;
 const now=performance.now(); if(now-burstAt>1000){burst=0;burstAt=now;} if(++burst>150)return stop('应用更新过于频繁，已停止');
 if(e.data?.type==='ack'){booting=false;pending=false;if(events.length)dispatch(events.shift());return;}
 parent.postMessage(e.data,'*');
};
worker.onerror=()=>stop('应用运行失败');
window.onmessage=e=>{
 if(e.source!==parent||stopped)return;
 if(e.data?.type==='stop')return stop('应用已停止');
 if(e.data?.type==='event'){
  if(!pending)return dispatch(e.data);
  if(events.length>=256)return stop('待处理操作过多，已停止，请重新启动');
  events.push(e.data);
 }else if(e.data?.type==='tick'&&!pending)dispatch(e.data);
};
setInterval(()=>{if(pending&&performance.now()-started>(booting?8000:750))stop('应用计算超时，已停止');},100);
 } catch(error) { parent.postMessage({type:'error',message:'无法启动本地计算：'+String(error.message||error).slice(0,150)},'*'); }
});
</script>
